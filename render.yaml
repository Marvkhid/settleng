# Render Blueprint for the SettleNG API. Render: New > Blueprint > pick this repo.
# The web app is deployed separately on Vercel (Root Directory: web). See docs/DEPLOYMENT.md.
#
# Important: this service must build from the REPOSITORY ROOT, not from api/, because the repo is
# an npm workspace whose single lockfile (package-lock.json) lives at the root. The build script
# installs only the api workspace, so a root-level build is still small.
#
# Do not use Render's auto-detected Yarn command (`yarn install; yarn build`): this repo uses npm,
# and Yarn 1 refuses to run while package.json declares a package manager it is not.
services:
  - type: web
    name: settleng-api
    runtime: node
    rootDir: .
    buildCommand: bash scripts/render-build.sh
    startCommand: npm run start:deploy --prefix api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL     # Supabase pooled connection string (port 6543)
        sync: false
      - key: DIRECT_URL       # Supabase direct / session connection string (port 5432), used for migrations
        sync: false
      - key: SUPABASE_URL     # your Supabase project URL, for example https://xyz.supabase.co (verifies sign-in tokens)
        sync: false
      - key: CORS_ORIGIN      # your website URL, for example https://settleng.vercel.app
        sync: false
